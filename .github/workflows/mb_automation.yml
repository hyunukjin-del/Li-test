name: Wet Reaction MB Automation Agent

on:
  push:
    paths:
      - 'data/runs/*.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-mb-agent:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 3.10 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: M/B 에이전트 실행
        run: |
          TARGET_FILE=$(ls -t data/runs/*.json | head -n 1)
          echo "실행 대상 파일: $TARGET_FILE"
          python src/mb_agent.py "$TARGET_FILE"

      - name: 웹 화면에 결과 요약 출력
        run: |
          cat summary.md >> $GITHUB_STEP_SUMMARY

      - name: 엑셀 파일 다운로드용 저장
        uses: actions/upload-artifact@v4
        with:
          name: mb-excel-reports
          path: reports/*.xlsx

      - name: 엑셀 및 트렌드 파일 저장소에 자동 저장
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/trend_history.csv reports/
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 [Auto] M/B 리포트 및 트렌드 자동 업데이트" && git push)
